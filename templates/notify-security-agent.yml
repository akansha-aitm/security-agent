# Copy to .github/workflows/notify-security-agent.yml in a repository to have the security agent
# scan it right after every push (instead of waiting for the hourly scan).
#
# Needs, in that repository (Settings > Secrets and variables > Actions):
#   secret   SECURITY_AGENT_TRIGGER_TOKEN  fine-grained token: repository access = the agent's repo only,
#                                          permission Actions: Read and write. It can only start the agent's
#                                          workflow: it cannot read this repo, change code or read secrets.
#   variable SECURITY_AGENT_REPO           owner/name of the agent's repository, e.g. my-org/security-agent
#
# This job never checks out or runs this repository's code, and sends only the repository name.
name: notify-security-agent

on:
  push: # every branch, including branch deletions

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Ask the security agent to scan this repository
        env:
          GH_TOKEN: ${{ secrets.SECURITY_AGENT_TRIGGER_TOKEN }}
          AGENT_REPO: ${{ vars.SECURITY_AGENT_REPO }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$AGENT_REPO" ]; then
            echo "SECURITY_AGENT_TRIGGER_TOKEN or SECURITY_AGENT_REPO is not set: skipped (the hourly scan still runs)"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$AGENT_REPO/actions/workflows/security-scan.yml/dispatches" \
            -d "$(jq -nc --arg repo "$REPO" '{ref: "main", inputs: {mode: "scan", repo: $repo}}')"
          echo "Scan requested for $REPO"
